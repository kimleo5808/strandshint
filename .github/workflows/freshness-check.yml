name: Puzzle data freshness check

# Detects silent staleness — the failure that went unnoticed for ~2.5 months.
# Checks both the WRITE side (Worker /health) and the READ side (live pages),
# and opens an issue if either goes stale.

on:
  schedule:
    # After the puzzle-updater cron runs (00:30 / 08:30 / 16:30 UTC)
    - cron: "0 10 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run freshness check
        id: check
        run: |
          set -o pipefail
          node scripts/check-freshness.mjs 2>&1 | tee freshness.log

      - name: Open issue on staleness
        if: failure() && steps.check.conclusion == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('freshness.log') ? fs.readFileSync('freshness.log', 'utf8') : '(no log)';
            const TITLE = '🚨 Puzzle data is stale';
            const body = [
              'The scheduled freshness check failed — puzzle data is not updating.',
              '',
              '```',
              log.trim().slice(-4000),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Likely causes: puzzle-updater Worker stopped (write side) or the app',
              'is not reading KV / missing ISR (read side). See README "How puzzle data flows".',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'freshness',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: ['freshness'],
              });
            }
