name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://strandshint.app
      NEXT_PUBLIC_GOOGLE_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ID }}
      NEXT_PUBLIC_GOOGLE_ADSENSE_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADSENSE_ID }}
      NEXT_PUBLIC_BAIDU_TONGJI: ${{ secrets.NEXT_PUBLIC_BAIDU_TONGJI }}
      NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ secrets.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
      NEXT_PUBLIC_PLAUSIBLE_SRC: ${{ secrets.NEXT_PUBLIC_PLAUSIBLE_SRC }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same as `pnpm run deploy`, split so only the upload is retried.
      # (`opennextjs-cloudflare build` runs `pnpm build`, which includes
      # scripts/build-content.mjs.)
      - name: Build with OpenNext
        run: pnpm exec opennextjs-cloudflare build

      # `wrangler r2 bulk put` (the R2 cache upload) fails the whole deploy
      # when a single object gets a transient 502 from Cloudflare's API. A
      # retry re-uploads 233-ish objects, well under the account's
      # 1,200-requests-per-5-minutes limit.
      - name: Deploy with OpenNext
        run: |
          for attempt in 1 2 3; do
            pnpm exec opennextjs-cloudflare deploy && exit 0
            echo "::warning::Deploy attempt $attempt failed; retrying in 30s"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1
