name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 8 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://strandshint.app
      NEXT_PUBLIC_GOOGLE_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ID }}
      NEXT_PUBLIC_GOOGLE_ADSENSE_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADSENSE_ID }}
      NEXT_PUBLIC_BAIDU_TONGJI: ${{ secrets.NEXT_PUBLIC_BAIDU_TONGJI }}
      NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ secrets.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
      NEXT_PUBLIC_PLAUSIBLE_SRC: ${{ secrets.NEXT_PUBLIC_PLAUSIBLE_SRC }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Strands puzzle data
        run: pnpm run update:strands

      - name: Update Connections puzzle data
        run: pnpm run update:connections

      - name: Update Wordle puzzle data
        run: pnpm run update:wordle

      - name: Commit data updates
        if: github.event_name == 'schedule'
        run: |
          CHANGED=0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/strands/puzzles.json)" ]]; then
            git add data/strands/puzzles.json
            CHANGED=1
          fi
          if [[ -n "$(git status --porcelain data/connections/puzzles.json)" ]]; then
            git add data/connections/puzzles.json
            CHANGED=1
          fi
          if [[ -n "$(git status --porcelain data/wordle/puzzles.json)" ]]; then
            git add data/wordle/puzzles.json
            CHANGED=1
          fi
          if [[ "$CHANGED" == "1" ]]; then
            git commit -m "chore: update puzzle data"
            git push
          else
            echo "No puzzle data changes to commit"
          fi

      - name: Build and deploy with OpenNext
        run: pnpm run deploy
