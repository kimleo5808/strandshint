name: Deploy puzzle-updater Worker

# Deploys the standalone cron Worker that writes puzzle data to KV.
# The main app workflow does NOT cover this Worker, so without this it would
# only ever deploy by hand — and a forgotten deploy means KV silently stops
# updating.

on:
  push:
    branches:
      - main
    paths:
      - "workers/puzzle-updater/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: workers/puzzle-updater
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
