name: Keepalive

# GitHub disables scheduled workflows after 60 days of repository inactivity —
# which is exactly how the freshness check went silent in Aug 2026. This runs
# monthly, makes one real commit (resetting the 60-day clock for every
# scheduled workflow in the repo) and re-enables the freshness check in case
# it already got disabled.
#
# The commit carries [skip ci] so it does not trigger a Cloudflare redeploy.

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Touch timestamp and push
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive [skip ci]"
          git push

      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in freshness-check.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" \
              && echo "enabled: $wf" \
              || echo "already enabled or not disable-able: $wf"
          done
