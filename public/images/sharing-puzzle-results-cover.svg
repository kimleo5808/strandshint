<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Sharing Your Results">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1020" cy="140" r="300" fill="url(#glow)"/>
  <rect x="0" y="0" width="10" height="675" fill="#34d399"/>

  <text x="80" y="150" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="26" font-weight="700" letter-spacing="6" fill="#34d399">PUZZLE CULTURE</text>

  <text y="270" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="76" font-weight="800" fill="#e2e8f0">
      <tspan x="80" dy="0">Sharing Your</tspan>
      <tspan x="80" dy="86">Results</tspan>
  </text>

  <text x="80" y="440" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="32" fill="#94a3b8">How the emoji grid took over.</text>

  <rect x="80" y="520" width="60" height="60" rx="12" fill="#10b981" opacity="0.9"/>
  <rect x="156" y="520" width="60" height="60" rx="12" fill="#f59e0b" opacity="0.9"/>
  <rect x="232" y="520" width="60" height="60" rx="12" fill="#334155" opacity="0.9"/>
  <rect x="308" y="520" width="60" height="60" rx="12" fill="#10b981" opacity="0.9"/>

  <text x="1120" y="610" text-anchor="end" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="24" font-weight="600" fill="#64748b">strandshint.app</text>
</svg>
